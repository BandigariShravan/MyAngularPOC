<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <div class="login-left">
            <img src="https://openclipart.org/image/400px/277079" alt="Illustration" width="25">
        </div>
        <div class="login-right">
            <h2>Welcome Back :)</h2>
            <p>To keep connected with us, please login with your email and password.</p>
            <form>
                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <div class="options">
                    <div class="remember-me">
                        <label for="remember">Remember Me</label>
                        <input type="checkbox" id="remember">
                    </div>
                    <p><a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a></p>
                </div>
                <button type="submit">Login Now</button>
                <button class="create-account">Create Account</button>
                <p class="or">Or you can join with</p>
                <div class="social-icons">
                    <a href="https://accounts.google.com/v3/signin/identifier?hl=en&ifkv=ASSHykqdNwURkV7a2tB9pRp2Sft9Eb3VSMazPh6M6GPxNsfr4HZS5yIWdzAOT4roPwhlxUO6VcyCyA&flowName=GlifWebSignIn&flowEntry=ServiceLogin&dsh=S353911565%3A1740144983714736&ddm=1" target="_blank"><img src="https://www.google.com/favicon.ico" alt="Google" width="20"> </a>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png"
                        alt="Facebook" width="20">
                    <img src="https://abs.twimg.com/favicons/twitter.2.ico" alt="Twitter" width="20">


                </div>
            </form>
        </div>
    </div>
</body>

</html>
